name: Task Management CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "Practical-12/backend/**"
      - ".github/workflows/ci.yml"

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: Practical-12/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Practical-12/backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run backend tests
        run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/task_management_ci
          JWT_SECRET: practical-12-ci-only-secret
